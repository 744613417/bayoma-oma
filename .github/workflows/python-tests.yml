name: python-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[plot]"
          python -m pip install jsonschema

      - name: 自检（合成数据，不含 MATLAB 对照与现场数据）
        run: python python/tests/test_smoke.py

      - name: 教程片段核对
        run: python python/tests/test_tutorial_snippets.py

      - name: 结果分组
        run: python python/tests/test_results.py
